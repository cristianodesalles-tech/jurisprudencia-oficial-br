name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s plugins/jurisprudencia-oficial-br/tests -v
      - run: python3 -m compileall -q plugins/jurisprudencia-oficial-br/engine plugins/jurisprudencia-oficial-br/mcp plugins/jurisprudencia-oficial-br/scripts
      - run: python3 scripts/doctor.py
      - run: python3 -m json.tool plugins/jurisprudencia-oficial-br/.codex-plugin/plugin.json >/dev/null
      - run: python3 -m json.tool plugins/jurisprudencia-oficial-br/config/sources.json >/dev/null
      - run: python3 -m json.tool plugins/jurisprudencia-oficial-br/config/courts.json >/dev/null
      - run: cp .env.example .env && docker compose config --quiet
      - run: test -z "$(grep -R '\[TODO:' plugins/jurisprudencia-oficial-br || true)"
      - run: test -z "$(grep -R -E 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|sk-[A-Za-z0-9]{20,}' . --exclude-dir=.git || true)"
