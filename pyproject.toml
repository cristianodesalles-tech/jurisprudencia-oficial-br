[project]
name = "jurisprudencia-oficial-br"
version = "0.2.1"
description = "Pesquisa jurisprudencial brasileira auditável e orientada a fontes oficiais"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.optional-dependencies]
production = [
  "fastapi==0.139.2",
  "uvicorn[standard]>=0.30,<1",
  "psycopg[binary]==3.3.4",
  "boto3>=1.35,<2",
  "redis>=6,<9",
  "rq>=2,<3",
  "pypdf>=5,<7",
  "sentence-transformers==5.6.1"
]

[tool.ruff]
line-length = 120
target-version = "py311"
